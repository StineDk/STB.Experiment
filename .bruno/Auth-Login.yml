info:
  name: Auth/Login
  type: http
  seq: 2

http:
  method: POST
  url: "{{BaseUrl}}/auth/login"
  body:
    type: json
    data: |-
      {
        "Email": "Test",
        "Password": "Password"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status == 200) {
          const data = res.body;
          const loginRes = data.loginResponse
          bru.setEnvVar("JwtToken", loginRes.token);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
